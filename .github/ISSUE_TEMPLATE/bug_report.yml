name: Bug report
description: Report a reproducible DevHub V2 problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include tokens, secrets or personal file contents.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - Windows (not officially supported yet)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DevHub version / commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Technical log
      description: Copy the expandable technical log or terminal output with secrets removed.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed tokens, API keys and personal data from the report.
          required: true
        - label: I did not perform a real uninstall of system software for this report.
          required: true
