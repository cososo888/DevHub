name: Package macOS release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and verify Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run package:macos
      - uses: actions/upload-artifact@v4
        with:
          name: DevHub-macOS-arm64
          path: src-tauri/target/release/distribution/*/*
          if-no-files-found: error
