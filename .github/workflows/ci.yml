name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: TypeScript, UI and Rust
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Frontend build
        run: npm run build

      - name: UI tests
        run: npm run test:ui

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
